---
- name: Converge to a Postfix server that has the role defaults set.
  hosts: all

  tasks:
    - name: "Set the fqdn and domain facts to something static for the tests"
      ansible.builtin.set_fact:
        ansible_facts: "{{ ansible_facts | combine({'fqdn': 'mail.test', 'domain': 'test'}) }}"

    - name: "Include unibeid.postfix"
      ansible.builtin.include_role:
        name: "unibeid.postfix"
